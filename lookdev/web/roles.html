<!doctype html><html><head><meta charset="utf-8"><script type="importmap">{"imports":{"three":"../../web/vendor/three.module.js"}}</script></head><body style="margin:0">
<canvas id="o" width="2640" height="2000"></canvas>
<script type="module">
import { Flat2D } from '../../web/flat2d.js';
import { ROLE_IDS, role, act } from '../../web/roles.js';
const o = document.getElementById('o').getContext('2d');
const poses = ['idle','wave','point','cheer','shrug','hips','think','carry','laugh','angry','pointUp','push'];
const faces = [{eyes:'dot',mouth:'grin'},{eyes:'dot',mouth:'bigsmile'},{eyes:'wide',mouth:'o',brow:1},{eyes:'sly',mouth:'smirk',sly:1},{eyes:'happy',mouth:'grin'},{eyes:'dot',mouth:'frown',brow:-1},{eyes:'calm',mouth:'smile'}];

</script></body></html>
