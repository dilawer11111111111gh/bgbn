name: render
on:
  push:
    branches: [main]
    paths: ['*/web/**', '*/audio/mix.mp3', '*/frames.txt', 'web/**', 'app.txt', '.github/workflows/render.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seg:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install ffmpeg + browser
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          npm i --no-save playwright@1.47.2 > /dev/null && npx playwright install --with-deps chromium > /dev/null
      - name: Render four equal segments (N/32 frames each) in parallel (all 4 CPUs)
        run: |
          export APP=$(cat app.txt 2>/dev/null || echo tree); TIER=$(cat $APP/tier.txt 2>/dev/null || echo good); N=$(cat $APP/frames.txt 2>/dev/null || echo 1786); C=$(( (N + 31) / 32 )); A=$(( ${{ matrix.part }} * 4 * C ))
          for k in 0 1 2 3; do S=$(( A + k * C )); E=$(( S + C )); [ $E -gt $N ] && E=$N; [ $S -lt $N ] && node $APP/tools/par_render_mb.cjs $TIER $S $E out/seg > log_$k.txt 2>&1 & done
          wait; cat log_*.txt 2>/dev/null || true; mkdir -p out/seg; ls out/seg
      - uses: actions/upload-artifact@v4
        with: { name: 'seg-${{ matrix.part }}', path: 'out/seg/*.mp4', if-no-files-found: ignore }
  join:
    needs: seg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
      - uses: actions/download-artifact@v4
        with: { pattern: 'seg-*', merge-multiple: true, path: out/seg }
      - name: Join segments + captions + voice
        run: |
          ls out/seg | grep -v part | sort | sed "s|^|file '$PWD/out/seg/|; s|$|'|" > list.txt; wc -l list.txt
          APP=$(cat app.txt 2>/dev/null || echo tree); AUD=$APP/audio/mix.mp3; [ -f $AUD ] || AUD=$APP/audio/voice.mp3; VF="unsharp=5:5:0.55"; [ -f $APP/captions.ass ] && VF="unsharp=5:5:0.55,ass=$APP/captions.ass"
          ffmpeg -v error -y -f concat -safe 0 -i list.txt -i $AUD -vf "$VF" -map 0:v -map 1:a -c:v libx264 -profile:v high -preset slow -crf 18 -maxrate 12M -bufsize 24M -pix_fmt yuv420p -c:a aac -ar 44100 -ac 2 -b:a 160k -shortest -movflags +faststart final.mp4
          for CRF in 20 22 24; do [ $(stat -c%s final.mp4) -lt 94000000 ] && break; ffmpeg -v error -y -f concat -safe 0 -i list.txt -i $AUD -vf "$VF" -map 0:v -map 1:a -c:v libx264 -profile:v high -preset slow -crf $CRF -maxrate 9M -bufsize 18M -pix_fmt yuv420p -c:a aac -ar 44100 -ac 2 -b:a 160k -shortest -movflags +faststart final.mp4; done   # GitHub file limit 100 MB
          ls -la final.mp4
      - uses: actions/upload-artifact@v4
        with: { name: final-video, path: final.mp4 }
      - name: Save video to the renders branch
        run: |
          APPN=$(cat app.txt 2>/dev/null || echo tree); git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git fetch --depth 1 origin renders && git checkout -B renders FETCH_HEAD || git checkout --orphan renders; git rm -rq --cached . 2>/dev/null; mkdir -p videos && cp final.mp4 videos/${APPN}_$(date +%Y%m%d_%H%M).mp4
          git add videos && git commit -qm "Rendered video" && git push origin renders
